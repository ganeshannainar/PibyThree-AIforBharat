version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      # Named volume for persistent data - survives container deletion
      - ecommerce_postgres_data:/var/lib/postgresql/data
      # Mount init scripts (optional - for first-time setup)
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Named volume - data persists even if container is deleted
  ecommerce_postgres_data:
    name: ecommerce_postgres_data
    driver: local
